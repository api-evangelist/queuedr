name: QueueDr
description: QueueDr is a healthcare scheduling automation product that automatically fills unexpected
  appointment cancellations, rebooks no-shows, and balances provider schedules to reduce lost revenue
  for medical practices and health systems. Originally a 500 Global-backed startup, QueueDr was acquired
  by Phreesia and is now offered as the Phreesia Appointment Accelerator within Phreesia's patient
  intake and engagement platform. The queuedr.com domain now redirects to Phreesia; existing customers
  continue to sign in at the app.queuedr.com dashboard. No independent public developer portal, API
  documentation, SDKs, or machine-readable API surface is published for QueueDr as a standalone product.
